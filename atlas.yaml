# The map of Atlas Carries Us itself. Run `acu serve` in the repository root
# to read it (build the viewer and the TypeScript adapter first; see the
# README). scripts/check.sh builds it on every change, and
# tests/e2e/docs.mjs fails when a unit, file, item or exported member lacks a
# doc comment, so the map never shows "No doc comment" for this project.
version: 1
project:
  name: Atlas Carries Us
  descriptionDrafted: { by: Claude Code, at: "2026-11-23T16:00:00Z" }
  repo: revslaughter/atlas-carries-us
  links: github
  description: |
    Atlas Carries Us turns a code base and its doc comments into an
    interactive map. This map shows the project itself.

    Three adapters read code: the Go adapter with the Go type checker, the
    TypeScript adapter with the TypeScript compiler, and the Rust adapter
    with rustdoc and rust-analyzer. Each writes the same data format,
    atlas.json. The acu command runs the adapters, applies atlas.yaml and
    builds the site. The viewer reads atlas.json and draws the map in the
    browser.

    The parts share no code: they meet only in atlas.json and in the request
    that acu sends each adapter, so no line joins their regions.
  autolinks:
    - pattern: "(?<![\\w/&])#(\\d+)\\b"
      url: "https://github.com/{repo}/issues/$1"
languages:
  - adapter: go
    root: adapters/go
  - adapter: typescript
    # tsconfig.atlas.json references the viewer and the TypeScript adapter,
    # so that one run reads both from the repository root.
    options: { tsconfig: tsconfig.atlas.json }
    exclude: ["corpus/**", "target/**", "out/**", "examples/**", "**/testdata/**", "**/dist/**", "**/dist-test/**"]
    tests: ["viewer/test/**", "adapters/typescript/test/**"]
  - adapter: rust
  - adapter: python
    root: adapters/python
    exclude: ["testdata/**"]
    tests: ["tests/**"]
entryPoints:
  - plugin: clap
regions:
  - id: go
    name: Reading Go code
    drafted: { by: Claude Code, at: "2026-11-23T01:20:00Z" }
    paths: ["adapters/go/**"]
    description: >-
      The Go adapter. It loads a module's packages with the Go type checker,
      so every edge it writes counts as exact, and it writes the data format
      from its own Go types in internal/schema.
    readingTip: >-
      Start with Run in internal/extract: it runs the passes in order.
      plugins.go finds HTTP routes and commands; docs.go turns doc comments
      into the normal form.
  - id: ts
    name: Reading TypeScript code
    drafted: { by: Claude Code, at: "2026-11-23T01:20:00Z" }
    paths: ["adapters/typescript/**"]
    description: >-
      The TypeScript adapter. It reads a project with the TypeScript compiler
      API, reads Svelte components through svelte2tsx, finds Express, Hono
      and SvelteKit routes, and writes the same data format as the Go
      adapter.
    readingTip: >-
      Start with Extractor.run in extract.ts: it runs the passes in order.
      docs.ts holds the doc normaliser, plugins.ts and sveltekit.ts the route
      plugins, and svelte.ts the components.
  - id: rust
    name: Reading Rust code
    drafted: { by: Claude Code, at: "2026-11-23T16:00:00Z" }
    paths: ["adapters/rust/**"]
    description: >-
      The Rust adapter. It reads a Cargo workspace with rustdoc's JSON output
      and rust-analyzer's SCIP index from one pinned nightly toolchain, finds
      axum routes and clap commands, and writes the same data format.
    readingTip: >-
      Start with run in extract.rs: it runs the passes in order. scip.rs
      decodes the index, docs.rs normalises the docs, and plugins.rs reads
      the tokens around each registration.
  - id: python
    name: Reading Python code
    drafted: { by: Claude Code, at: "2026-11-24T12:00:00Z" }
    paths: ["adapters/python/**"]
    description: >-
      The Python adapter. It reads Python with the standard library's ast
      module and a resolver of its own, finds routes and commands of six
      frameworks, and writes the same data format.
    readingTip: >-
      Start with extract in extract.py: it runs the passes in order. index.py
      records declarations, resolve.py gives names their meaning, and
      plugins.py finds the entry points.
  - id: acu
    name: Running adapters and building the site
    drafted: { by: Claude Code, at: "2026-11-23T16:00:00Z" }
    paths: ["cli/**"]
    description: >-
      The acu command. It runs each adapter as its own program, merges their
      documents, applies atlas.yaml, checks the result, and builds or serves
      the site with the viewer built in.
    readingTip: Start with run in main.rs; each command starts there.
  - id: viewer
    name: Drawing the map
    drafted: { by: Claude Code, at: "2026-11-23T01:20:00Z" }
    paths: ["viewer/**"]
    description: >-
      The viewer: one static page that reads atlas.json and draws four views
      on one canvas (overview, unit focus, item focus and trace), with a docs
      panel beside it.
    readingTip: >-
      Read the Model first: every view reads it. Then go in app.ts, which
      every move passes through, then the scene builders in scene.ts.
layout:
  rows:
    - [go, ts, rust]
    - [acu, viewer]
    - [python]
tour:
  - title: Six parts and a file between them
    drafted: { by: Claude Code, at: "2026-11-24T11:00:00Z" }
    open: { view: overview }
    text: >-
      Four adapters read code, acu runs them and builds the site, and the
      viewer draws the map. They share no code: each adapter writes
      atlas.json, acu completes it, and the viewer reads it. So no line joins
      the regions.
  - title: The Go adapter in one call
    drafted: { by: Claude Code, at: "2026-11-23T01:20:00Z" }
    open: { view: trace, symbol: Run }
    text: >-
      Run loads the module's packages with go/packages, so every fact comes
      from the type checker. Then it runs the passes in order: declarations,
      relations, tests, and docs last, so that doc links can resolve to IDs.
      document sorts every list, so two runs write the same bytes.
  - title: A call, as the type checker sees it
    drafted: { by: Claude Code, at: "2026-11-23T01:20:00Z" }
    open: { view: symbol, name: extractor.walkCalls }
    text: >-
      walkCalls asks the type checker which function each call reaches, and
      records an edge from the caller. A call through an interface reaches
      the interface method; the viewer later follows implements edges to the
      code that can run.
  - title: The same plan in TypeScript
    drafted: { by: Claude Code, at: "2026-11-23T01:20:00Z" }
    open: { view: trace, symbol: Extractor.run }
    text: >-
      The TypeScript adapter follows the same plan with the TypeScript
      compiler. run loads the program, declares each file, lets the plugins
      find routes, records relations, imports and calls, then resolves the
      docs and indexes the tests.
  - title: The same plan in Rust
    drafted: { by: Claude Code, at: "2026-11-23T16:00:00Z" }
    open: { view: trace, symbol: "rs:acu_adapter_rust::extract#run" }
    text: >-
      The Rust adapter has no compiler API to call, so run asks two tools.
      cargo metadata lists the crates, rustdoc writes each crate's items as
      JSON, and rust-analyzer writes a SCIP index of every reference. The
      passes then declare the items, resolve rustdoc's IDs across crates,
      read the references for calls and tests, and let the plugins find
      routes and commands.
  - title: From config to data
    drafted: { by: Claude Code, at: "2026-11-23T16:00:00Z" }
    open: { view: trace, symbol: "rs:acu#extract_unchecked" }
    text: >-
      acu loads atlas.yaml, then runs each adapter as its own program: one
      JSON request on standard input, one document on standard output. It
      merges the documents and applies the regions and the tour. extract
      then checks that every reference points at something that exists.
  - title: One form for every doc
    drafted: { by: Claude Code, at: "2026-11-23T01:20:00Z" }
    open: { view: symbol, id: "ts:atlas-carries-us-workspace/adapters/typescript/src/docs#normalise" }
    text: >-
      normalise turns a JSDoc or TSDoc comment into the normal form: blocks,
      inline text, and a field for each block tag. Its first sentence becomes
      the summary that every box shows. The viewer never needs to know a
      language's comment style.
  - title: The viewer's model
    drafted: { by: Claude Code, at: "2026-11-23T01:20:00Z" }
    open: { view: symbol, name: Model }
    text: >-
      The viewer reads atlas.json once into the Model. It groups symbols into
      items by unit, and turns edges into relations that keep the member at
      each end, so that a line can end at the exact method or field.
  - title: Every move
    drafted: { by: Claude Code, at: "2026-11-23T01:20:00Z" }
    open: { view: trace, symbol: go }
    text: >-
      Every click, key and tour step ends in go. It records the history,
      builds the scene, places the camera and moves the boxes into place, then
      updates the panel, the breadcrumbs, the address, the hint and the
      legend.
  - title: An item and its neighbours
    drafted: { by: Claude Code, at: "2026-11-23T01:20:00Z" }
    open: { view: symbol, name: buildSymScene }
    text: >-
      An item focus answers "what does this do, and what does it touch?".
      symbolRelations sorts every relation into lanes. buildSymScene puts what
      uses the item on the left and what it uses on the right, and shows a few
      boxes per lane, so the view stays near twenty boxes.
  - title: Your turn
    drafted: { by: Claude Code, at: "2026-11-23T01:20:00Z" }
    open: { view: overview }
    text: >-
      Pick any box to read its docs, or press / to search by name. Every box
      shows the first sentence of its doc comment, and the "trace" link beside
      a function follows its calls.
