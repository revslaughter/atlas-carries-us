[package]
name = "acu-adapter-rust"
description = "Reads Rust code with rustdoc's JSON output and rust-analyzer's SCIP index, and writes the Atlas Carries Us data format."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "acu_adapter_rust"
path = "src/lib.rs"

[[bin]]
name = "acu-adapter-rust"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
# The version must read the rustdoc JSON format of the pinned nightly in
# src/toolchain.rs: format 61.
rustdoc-types = "=0.61.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
jsonschema = { version = "0.63", default-features = false }
