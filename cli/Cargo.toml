[package]
name = "atlas-carries-us"
description = "Turn a code base and its doc comments into an interactive map: acu extract, build, serve and check."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "acu"

[[bin]]
name = "acu"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }
clap = { version = "4.6", features = ["derive"] }
globset = "0.4"
# The session secret of `acu serve` and `acu studio` (issue #42): random bytes
# from the operating system. The lock file already held it through uuid.
getrandom = "0.4"
include_dir = "0.7"
jsonschema = { version = "0.63", default-features = false }
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
# The MCP server of `acu serve` and `acu mcp` (issue #8). Exact, because the
# SDK changes its API between minor releases. No macros: docs/mcp.md lists the
# tools, and src/mcp/mod.rs writes their schemas by hand.
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

# The studio's folder picker opens a folder once, without following a link at
# any step, and works relative to it (issue #45): openat and its kin, with no
# unsafe code in acu. Unix only; on Windows the picker takes paths.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
