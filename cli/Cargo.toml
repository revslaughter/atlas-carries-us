[package]
name = "atlas-carries-us"
description = "Turn a code base and its doc comments into an interactive map: acu extract, build, serve and check."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "acu"

[[bin]]
name = "acu"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }
clap = { version = "4.6", features = ["derive"] }
globset = "0.4"
include_dir = "0.7"
jsonschema = { version = "0.63", default-features = false }
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[dev-dependencies]
tempfile = "3"
