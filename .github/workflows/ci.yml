name: CI

# Every check runs inside the "toolchain" stage of the Dockerfile, the same
# container that the VS Code devcontainer uses, so CI and development share
# one pinned set of tools.
#
# To save runner time, this workflow:
#   - skips a change that touches only docs: docs/ and the Markdown files at
#     the root, except CONTRIBUTING.md, which scripts/check-pins.sh reads;
#   - skips a draft pull request, and runs when it becomes ready for review;
#   - stops a pull request's older run when a new push arrives.
# image.yml builds the runtime image and the exported programs.

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!*.md"
      - "CONTRIBUTING.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**"
      - "!docs/**"
      - "!*.md"
      - "CONTRIBUTING.md"

permissions:
  contents: read

# One run per pull request: a new push stops the run before it. Runs on main
# wait in turn, so that each merge keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: All checks, in the toolchain container
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # A run takes about 12 minutes with a warm cache. The limit stops a hung
    # run long before GitHub's default of 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: toolchain
          tags: acu-toolchain:ci
          load: true
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,scope=toolchain,mode=max
      - name: Run scripts/check.sh
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workspace" acu-toolchain:ci scripts/check.sh
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: out/*.png
          if-no-files-found: ignore
