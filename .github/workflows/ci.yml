name: CI

# Every check runs inside the "toolchain" stage of the Dockerfile, the same
# container that the VS Code devcontainer uses, so CI and development share
# one pinned set of tools.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: All checks, in the toolchain container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: toolchain
          tags: acu-toolchain:ci
          load: true
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,scope=toolchain,mode=max
      - name: Run scripts/check.sh
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workspace" acu-toolchain:ci scripts/check.sh
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: out/*.png
          if-no-files-found: ignore

  image:
    name: Runtime image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: acu:ci
          load: true
          cache-from: |
            type=gha,scope=toolchain
            type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
      - name: Map the fixtures with the image
        run: |
          docker run --rm acu:ci --version
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci extract -c examples/lending/atlas.yaml -o out/lending.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci check -d out/lending.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci extract -c examples/mixed/atlas.yaml -o out/mixed.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci check -d out/mixed.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci extract -c examples/lending-rust/atlas.yaml -o out/lending-rust.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci check -d out/lending-rust.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci extract -c examples/lending-js/atlas.yaml -o out/lending-js.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci check -d out/lending-js.json
