name: CI

# Every check runs inside the "toolchain" stage of the Dockerfile, the same
# container that the VS Code devcontainer uses, so CI and development share
# one pinned set of tools.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: All checks, in the toolchain container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: toolchain
          tags: acu-toolchain:ci
          load: true
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,scope=toolchain,mode=max
      - name: Run scripts/check.sh
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workspace" acu-toolchain:ci scripts/check.sh
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: out/*.png
          if-no-files-found: ignore

  image:
    name: Runtime image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: acu:ci
          load: true
          cache-from: |
            type=gha,scope=toolchain
            type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
      - name: Map the fixtures with the image
        run: |
          docker run --rm acu:ci --version
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci extract -c examples/lending/atlas.yaml -o out/lending.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci check -d out/lending.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci extract -c examples/mixed/atlas.yaml -o out/mixed.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci check -d out/mixed.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci extract -c examples/lending-rust/atlas.yaml -o out/lending-rust.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci check -d out/lending-rust.json
      # The export stage writes the same programs to a folder on the runner.
      # Its build stage already sits in this builder's cache from the step
      # above. Then acu runs outside any container, with the runner's own Go
      # and Node, and finds its adapters beside itself. Both steps write to
      # the runner's temp folder: the container steps above leave out/ owned
      # by root.
      - name: Write acu and its adapters to a folder
        uses: docker/build-push-action@v6
        with:
          context: .
          target: export
          outputs: type=local,dest=${{ runner.temp }}/acu-export
          cache-from: |
            type=gha,scope=toolchain
            type=gha,scope=runtime
      - uses: actions/setup-go@v5
        with:
          go-version-file: adapters/go/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Map the Go and TypeScript fixtures with the exported folder
        run: |
          ls -l "$RUNNER_TEMP/acu-export"
          "$RUNNER_TEMP/acu-export/acu" --version
          "$RUNNER_TEMP/acu-export/acu" extract -c examples/mixed/atlas.yaml -o "$RUNNER_TEMP/mixed-export.json"
          "$RUNNER_TEMP/acu-export/acu" check -d "$RUNNER_TEMP/mixed-export.json"
