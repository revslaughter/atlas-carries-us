name: Image

# Builds the runtime image and the exported programs, and runs those
# programs on Linux, macOS and Windows. These jobs take the most runner
# time, and macOS and Windows minutes cost more than Linux minutes on a
# private repository. So a pull request runs them only when it changes what
# goes into the image or the programs: the Dockerfile, acu, the adapters, the
# pinned toolchains and dependencies, the release packing (release-pack.sh),
# or this file. Every push to main that changes
# more than docs runs them, which catches what a pull request skipped.
#
# This workflow packs three of the six release platforms with
# release-pack.sh, as release.yml does, and runs those archives. It does not
# build the arm64
# image or push anything. release.yml makes a full dry run of its own when a
# pull request changes it.
#
# Like ci.yml, this workflow skips a draft pull request, runs when it becomes
# ready for review, and stops a pull request's older run when a new push
# arrives.

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!*.md"
      - "CONTRIBUTING.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "cli/**"
      - "adapters/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "package-lock.json"
      - "viewer/package.json"
      - ".node-version"
      - ".python-version"
      - "scripts/docker-export.sh"
      - "scripts/release-pack.sh"
      - ".github/workflows/image.yml"

permissions:
  contents: read

# One run per pull request: a new push stops the run before it. Runs on main
# wait in turn, so that each merge keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Runtime image
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # A run takes about 10 to 14 minutes with a warm cache; a cold cache
    # builds the toolchain and the cross stage first. The limit stops a hung
    # run long before GitHub's default of 6 hours.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: acu:ci
          load: true
          cache-from: |
            type=gha,scope=toolchain
            type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
      - name: Map the fixtures with the image
        run: |
          docker run --rm acu:ci --version
          # A bad request must make the Python adapter exit with an error.
          if echo 'no request' | docker run --rm -i --entrypoint acu-adapter-python acu:ci >/dev/null 2>&1; then
            echo "ci: the Python adapter in the image exits with 0 on a bad request" >&2
            exit 1
          fi
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci extract -c examples/lending/atlas.yaml -o out/lending.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci check -d out/lending.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci extract -c examples/mixed/atlas.yaml -o out/mixed.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci check -d out/mixed.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci extract -c examples/lending-rust/atlas.yaml -o out/lending-rust.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci check -d out/lending-rust.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci extract -c examples/lending-python/atlas.yaml -o out/lending-python.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci check -d out/lending-python.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci extract -c examples/lending-js/atlas.yaml -o out/lending-js.json
          docker run --rm -v "$GITHUB_WORKSPACE:/work" acu:ci check -d out/lending-js.json
      # The export stage writes the same programs to a folder on the runner.
      # Its build stage already sits in this builder's cache from the step
      # above. Then acu runs outside any container, with the runner's own Go
      # and Node, and finds its adapters beside itself. Every step writes to
      # the runner's temp folder: the container steps above leave out/ owned
      # by root. provenance: false keeps buildx from writing a
      # provenance.json into the folder.
      - name: Write acu and its adapters to a folder
        uses: docker/build-push-action@v6
        with:
          context: .
          target: export
          provenance: false
          outputs: type=local,dest=${{ runner.temp }}/acu-export
          cache-from: |
            type=gha,scope=toolchain
            type=gha,scope=runtime
      # The same stage cross-compiles for macOS and Windows on this Linux
      # runner. The job "cross" below runs the results.
      - name: Write the macOS (arm64) programs to a folder
        uses: docker/build-push-action@v6
        with:
          context: .
          target: export
          platforms: darwin/arm64
          provenance: false
          outputs: type=local,dest=${{ runner.temp }}/acu-darwin-arm64
          cache-from: |
            type=gha,scope=toolchain
            type=gha,scope=runtime
      - name: Write the Windows (amd64) programs to a folder
        uses: docker/build-push-action@v6
        with:
          context: .
          target: export
          platforms: windows/amd64
          provenance: false
          outputs: type=local,dest=${{ runner.temp }}/acu-windows-amd64
          cache-from: |
            type=gha,scope=toolchain
            type=gha,scope=runtime
      # scripts/release-pack.sh packs each folder as release.yml does: it
      # checks that the folder holds acu and its four adapters, and keeps the
      # executable mode inside the archive. The job "cross" runs the macOS and
      # Windows archives, so CI tests the same files that a release ships.
      - name: Pack the macOS and Windows programs as release archives
        run: |
          scripts/release-pack.sh "$RUNNER_TEMP/acu-darwin-arm64" ci darwin/arm64 "$RUNNER_TEMP/dist"
          scripts/release-pack.sh "$RUNNER_TEMP/acu-windows-amd64" ci windows/amd64 "$RUNNER_TEMP/dist"
      - name: Keep the macOS archive
        uses: actions/upload-artifact@v4
        with:
          name: acu-darwin-arm64
          path: ${{ runner.temp }}/dist/acu-ci-darwin-arm64.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Keep the Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: acu-windows-amd64
          path: ${{ runner.temp }}/dist/acu-ci-windows-amd64.zip
          if-no-files-found: error
          retention-days: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: adapters/go/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Map the Go, TypeScript and Python fixtures with the exported folder
        run: |
          scripts/release-pack.sh "$RUNNER_TEMP/acu-export" ci linux/amd64 "$RUNNER_TEMP/dist"
          tar -xzf "$RUNNER_TEMP/dist/acu-ci-linux-amd64.tar.gz" -C "$RUNNER_TEMP"
          dir="$RUNNER_TEMP/acu-ci-linux-amd64"
          ls -l "$dir"
          "$dir/acu" --version
          if echo 'no request' | "$dir/acu-adapter-python" >/dev/null 2>&1; then
            echo "ci: the Python adapter in the archive exits with 0 on a bad request" >&2
            exit 1
          fi
          "$dir/acu" extract -c examples/mixed/atlas.yaml -o "$RUNNER_TEMP/mixed-export.json"
          "$dir/acu" check -d "$RUNNER_TEMP/mixed-export.json"
          "$dir/acu" extract -c examples/lending-python/atlas.yaml -o "$RUNNER_TEMP/lending-python-export.json"
          "$dir/acu" check -d "$RUNNER_TEMP/lending-python-export.json"

  # The macOS and Windows archives from the "image" job, unpacked and run on
  # a machine of that system with its own Go, Node and Python. Outputs go to
  # the runner's temp folder. When the image job is skipped, so is this one.
  cross:
    name: Exported programs on ${{ matrix.os }}
    needs: image
    # The job maps two small examples; it takes about two minutes.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: acu-darwin-arm64
            exe: ""
          - os: windows-latest
            artifact: acu-windows-amd64
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/archive
      - name: Unpack the macOS archive
        if: runner.os == 'macOS'
        run: tar -xzf "$RUNNER_TEMP/archive/acu-ci-darwin-arm64.tar.gz" -C "$RUNNER_TEMP"
      - name: Unpack the Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -Path "$env:RUNNER_TEMP/archive/acu-ci-windows-amd64.zip" -DestinationPath "$env:RUNNER_TEMP"
      - uses: actions/setup-go@v5
        with:
          go-version-file: adapters/go/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Map the Go, TypeScript and Python fixtures with the unpacked archive
        env:
          EXE: ${{ matrix.exe }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          tmp=$RUNNER_TEMP
          if command -v cygpath >/dev/null 2>&1; then tmp=$(cygpath -u "$tmp"); fi
          dir="$tmp/${ARTIFACT/acu-/acu-ci-}"
          ls -l "$dir"
          # Windows runs no #! line, so there the archive holds
          # acu-adapter-python.pyz, which acu runs with Python by itself.
          py=("$dir/acu-adapter-python")
          if [ -n "$EXE" ]; then py=(python "$(cygpath -w "$dir/acu-adapter-python.pyz")"); fi
          if echo 'no request' | "${py[@]}" >/dev/null 2>&1; then
            echo "ci: the Python adapter in the archive exits with 0 on a bad request" >&2
            exit 1
          fi
          "$dir/acu$EXE" --version
          "$dir/acu$EXE" extract -c examples/mixed/atlas.yaml -o "$tmp/mixed-export.json"
          "$dir/acu$EXE" check -d "$tmp/mixed-export.json"
          "$dir/acu$EXE" extract -c examples/lending-python/atlas.yaml -o "$tmp/lending-python-export.json"
          "$dir/acu$EXE" check -d "$tmp/lending-python-export.json"
